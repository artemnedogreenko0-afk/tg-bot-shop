<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора — TG Bot Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <header class="border-b border-gray-800 bg-gray-950 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-500 flex items-center gap-2">
                <i class="fas fa-user-shield"></i> Панель администратора
            </h1>
            <a href="/" class="text-sm text-gray-400 hover:text-white transition">На главную</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-lg">
        <div class="bg-gray-800 rounded-xl p-8 border border-gray-700 shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">Добавить нового бота</h2>
            
            <form id="add-bot-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Название бота</label>
                    <input type="text" id="bot-name" required placeholder="Например: Бот-Гарант" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Описание</label>
                    <textarea id="bot-description" required rows="3" placeholder="Что умеет этот бот..." 
                              class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Цена (в рублях)</label>
                    <input type="number" id="bot-price" required placeholder="1490" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                </div>

                <button type="submit" 
                        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg transition duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> Сохранить в базу данных
                </button>
            </form>
            
            <div id="status-message" class="mt-4 text-center hidden font-medium"></div>
        </div>
    </main>

    <script>
        document.getElementById('add-bot-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Отменяем перезагрузку страницы

            const name = document.getElementById('bot-name').value;
            const description = document.getElementById('bot-description').value;
            const price = parseInt(document.getElementById('bot-price').value);
            const statusDiv = document.getElementById('status-message');

            try {
                // Отправляем данные на бэкенд
                const response = await fetch('/api/bots', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, price })
                });

                if (response.ok) {
                    statusDiv.innerText = "🎉 Бот успешно добавлен в базу!";
                    statusDiv.className = "mt-4 text-center text-emerald-400";
                    statusDiv.classList.remove('hidden');
                    document.getElementById('add-bot-form').reset(); // Очищаем форму
                } else {
                    statusDiv.innerText = "❌ Ошибка при сохранении.";
                    statusDiv.className = "mt-4 text-center text-red-400";
                    statusDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ Не удалось связаться с сервером.";
                statusDiv.className = "mt-4 text-center text-red-400";
                statusDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
