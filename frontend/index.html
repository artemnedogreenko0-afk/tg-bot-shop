<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG Bot Shop — Магазин Telegram Ботов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans">

    <header class="border-b border-gray-800 bg-gray-900 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-indigo-500 flex items-center gap-2">
                <i class="fab fa-telegram"></i> BotShop
            </a>
            <nav class="space-x-6">
                <a href="#" class="hover:text-indigo-400 transition">Каталог</a>
                <a href="#" class="hover:text-indigo-400 transition">Гарантии</a>
                <a href="#" class="hover:text-indigo-400 transition">Поддержка</a>
            </nav>
        </div>
    </header>

    <section class="container mx-auto px-4 py-16 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight">
            Прокачай свой бизнес с <span class="text-indigo-500">Telegram ботами</span>
        </h1>
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-8">
            Готовые решения для автопродаж, модерации чатов и автоматизации. Покупай, настраивай за 5 минут и запускай.
        </p>
        <a href="#catalog" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg shadow-lg transition duration-300">
            Смотреть каталог
        </a>
    </section>

    <main id="catalog" class="container mx-auto px-4 py-12">
        <h2 class="text-3xl font-bold mb-8 flex items-center gap-3">
            <span class="w-2 h-8 bg-indigo-500 rounded-full"></span> Наш каталог
        </h2>
        
        <div id="bots-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="text-gray-500 text-xl py-10 col-span-full text-center">Загрузка ботов...</div>
        </div>
    </main>

    <footer class="border-t border-gray-800 bg-gray-950 mt-20 py-8 text-center text-gray-500 text-sm">
        <p>&copy; 2026 TG Bot Shop. Все права защищены.</p>
    </footer>

    <script>
        async function loadBots() {
            try {
                const response = await fetch('/api/bots');
                const bots = await response.json();
                
                const container = document.getElementById('bots-container');
                container.innerHTML = ''; 

                bots.forEach(bot => {
                    const card = `
                        <div class="bg-gray-800 rounded-xl p-6 border border-gray-700 hover:border-indigo-500 transition-all flex flex-col justify-between shadow-md">
                            <div>
                                <div class="w-12 h-12 bg-indigo-500/10 rounded-lg flex items-center justify-center text-indigo-400 text-2xl mb-4">
                                    <i class="fas fa-robot"></i>
                                </div>
                                <h3 class="text-xl font-bold mb-2">${bot.name}</h3>
                                <p class="text-gray-400 text-sm mb-6">${bot.description}</p>
                            </div>
                            <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-700/50">
                                <span class="text-2xl font-bold text-emerald-400 flex items-center gap-1">
                                    <i class="fas fa-star text-amber-400 text-lg"></i> ${bot.price}
                                </span>
                                <button onclick="buyBot(${bot.id})" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
                                    Купить
                                </button>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });
            } catch (error) {
                console.error("Ошибка загрузки ботов:", error);
                document.getElementById('bots-container').innerHTML = '<div class="text-red-500 col-span-full text-center">Не удалось загрузить товары.</div>';
            }
        }

        // Функция покупки через Telegram Stars
        async function buyBot(id) {
            try {
                const response = await fetch('/api/buy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bot_id: id })
                });

                const data = await response.json();

                if (response.ok && data.invoice_link) {
                    // Перенаправляем пользователя на платежное окно Telegram
                    window.location.href = data.invoice_link;
                } else {
                    alert('Ошибка при создании счета: ' + (data.detail || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Не удалось связаться с сервером оплаты.');
            }
        }

        window.onload = loadBots;
    </script>
</body>
</html>
