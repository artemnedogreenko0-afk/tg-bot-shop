<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель управления</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans flex items-center justify-center h-screen">
    <div class="bg-gray-800 rounded-xl p-8 border border-gray-700 shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-white">Вход в панель</h2>
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Введите секретный пароль</label>
                <input type="password" id="admin-password" required placeholder="••••••••" 
                       class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg transition duration-300">
                Войти
            </button>
        </form>
        <div id="error-message" class="mt-4 text-center text-red-400 hidden">❌ Неверный пароль!</div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            localStorage.setItem('admin_password', password);
            
            const response = await fetch('/admin', { headers: { 'Authorization': password } });
            if (response.ok) {
                window.location.reload();
            } else {
                document.getElementById('error-message').classList.remove('hidden');
                localStorage.removeItem('admin_password');
            }
        });
    </script>
</body>
</html>
